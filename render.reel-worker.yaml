# Render Dashboard → New Blueprint → Blueprint Path: backend/render.reel-worker.yaml
services:
  - type: worker
    name: spacematch-reel-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.reel-worker
    dockerContext: .
    region: virginia
    plan: 1c-2g
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: APP_URL
        sync: false
      # Enter true for the shared Vercel test environment and false when testing ends.
      - key: REEL_TEST_PAYMENTS
        sync: false
      # Add REEL_SCRIBE_KEY, REEL_PLANNER_KEY, and REEL_PLANNER_MODEL in the
      # Render service environment if testing AI edits and timed captions.
